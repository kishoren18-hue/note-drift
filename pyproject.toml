[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "note-drift"
version = "0.2.0"
description = "Flag facts that are dropped, changed or invented when a clinical note is summarized"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kishore Nuthalapati" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["clinical nlp", "summarization", "hallucination", "patient safety", "llm evaluation"]

[project.urls]
Homepage = "https://github.com/kishoren18-hue/note-drift"
Issues = "https://github.com/kishoren18-hue/note-drift/issues"
Changelog = "https://github.com/kishoren18-hue/note-drift/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "pytest-cov>=5", "pre-commit>=3"]

[project.scripts]
note-drift = "note_drift.cli:main"

[tool.setuptools.package-data]
note_drift = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E501"]  # long lines are mostly HTML templates

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["E402"]
"examples/*" = ["E402"]
"benchmarks/*" = ["E402"]
