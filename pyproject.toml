[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "note-drift"
version = "0.1.0"
description = "Flag facts that are dropped, changed or invented when a clinical note is summarized"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kishore Nuthalapati" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["clinical nlp", "summarization", "hallucination", "patient safety", "llm evaluation"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
note-drift = "note_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
